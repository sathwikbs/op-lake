# ============================================================
# Minimal Docker-socket proxy (Phase 4 hardening).
#
# The ONLY container that touches the host Docker socket. It exposes a TCP
# endpoint that whitelists EXACTLY the calls uc-cred-refresher makes and denies
# everything else -- shrinking that refresher's root-equivalent blast radius to
# "list containers + restart one". Precisely: the single write allowed is
# POST /containers/{id}/restart.
#
# Allowed:  HEAD/GET /_ping, GET /version, GET /containers/json,
#           POST /containers/{id}/restart
# Denied:   create / exec / start / stop / kill / rm, images, volumes,
#           networks, swarm, exec, logs, everything else -> 403.
# ============================================================
user root;                      # needs read access to the root-owned docker.sock
worker_processes 1;
events { worker_connections 64; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    upstream docker { server unix:/var/run/docker.sock; }

    server {
        listen 2375;

        # --- read-only handshake + discovery ---
        location ~ ^/(v[0-9.]+/)?_ping$ {
            limit_except GET HEAD { deny all; }
            proxy_http_version 1.1;
            proxy_pass http://docker;
        }
        location ~ ^/(v[0-9.]+/)?version$ {
            limit_except GET { deny all; }
            proxy_http_version 1.1;
            proxy_pass http://docker;
        }
        location ~ ^/(v[0-9.]+/)?containers/json {
            limit_except GET { deny all; }
            proxy_http_version 1.1;
            proxy_pass http://docker;
        }

        # --- the ONLY write: restart a specific container ---
        location ~ ^/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/restart$ {
            limit_except POST { deny all; }
            proxy_http_version 1.1;
            proxy_pass http://docker;
        }

        # --- deny everything else ---
        location / { return 403; }
    }
}
