# TLS-terminating gRPC proxy for the Spark Connect compute edge.
#
#   client --(grpcs + Bearer token, TLS)--> spark-connect:15003 (this proxy)
#          --(grpc plaintext, Bearer token passed through)--> spark:15002
#
# The Bearer token rides in gRPC metadata and is validated by Spark's native
# PreSharedKeyAuthenticationInterceptor at :15002 (defense in depth: TLS here,
# token check at the server). This is ALSO the natural place to add per-user
# OIDC/JWKS validation in production -- see infra/spark-connect-proxy/README
# note in the repo README (auth_request against a JWKS-validating sidecar, or
# swap nginx for Envoy's jwt_authn filter).

worker_processes  auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr info;

    server {
        listen 15003 ssl;
        http2  on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # gRPC streams for Spark Connect can be long-lived (big jobs).
        grpc_read_timeout  3600s;
        grpc_send_timeout  3600s;

        location / {
            grpc_pass grpc://spark:15002;
        }
    }
}
