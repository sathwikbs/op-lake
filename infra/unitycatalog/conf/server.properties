#
# Unity Catalog server configuration -- the governance + auth + SECRET STORE.
#
# This file is a TEMPLATE. On stack start, the one-shot `uc-rotate` service
# copies it into the shared `uc_conf` volume and injects short-lived MinIO STS
# credentials into the s3.*.0 fields below (see infra/unitycatalog/rotate/rotate.sh).
# Unity Catalog then VENDS those credentials to engines (Spark) via
# its temporary-credentials API, so storage secrets live only in UC -- engines
# never hold long-lived object-store keys. On real cloud (S3/ADLS/GCS) UC vends
# per-request downscoped STS creds directly; on local MinIO we pre-mint a
# bucket-scoped STS session (rotated hourly) because UC OSS cannot yet call
# MinIO's STS endpoint itself (upstream PR #1636 is unreleased).
#
server.env=dev

# --- Authorization + external OIDC identity provider (Keycloak) ---
# The UC-internal admin token (etc/conf/token.txt) is always trusted. External
# OIDC (Keycloak) tokens are additionally accepted once allowed-issuers/audiences
# are set (see the uc-oauth wiring) to enable passwordless OAuth for humans (UI)
# and M2M engines.
server.authorization=enable
server.authorization-url=https://keycloak.localtest.me/realms/datalake/protocol/openid-connect/auth
server.token-url=http://keycloak:8080/realms/datalake/protocol/openid-connect/token
server.client-id=unitycatalog
# Vault-rendered at boot by uc-entrypoint.sh (sourced from the secrets_render
# volume). This sentinel is replaced with the real client secret from Vault; no
# real secret is committed here.
server.client-secret=__RENDER_UC_OIDC_CLIENT_SECRET__
server.redirect-port=
# Token-exchange (RFC 8693) at /api/1.0/unity-control/auth/tokens validates the
# external subject_token against BOTH of these before minting a UC token
# (mandatory hardening after CVE-2026-27478). audiences must match the 'aud'
# claim our clients mint via an audience mapper.
#
# allowed-issuers is a TRUST LIST. Phase 3: a SINGLE deterministic issuer.
# Keycloak's KC_HOSTNAME forces every token (browser auth-code AND backchannel
# client-credentials/password grants on :8080) to carry
# iss=https://keycloak.localtest.me/realms/datalake. UC fetches that issuer's
# JWKS over TLS via the Caddy gateway (the keycloak.localtest.me docker alias
# points UC at Caddy; UC trusts Caddy's local CA), so one issuer validates all.
server.allowed-issuers=https://keycloak.localtest.me/realms/datalake
server.audiences=unitycatalog
server.cookie-timeout=P5D

# --- Managed tables (experimental feature) ---
# Enable MANAGED Delta tables and set their storage root. Managed tables (no
# explicit LOCATION) are what we standardize on: UC owns the path, vends creds,
# and permits CREATE OR REPLACE (forbidden on EXTERNAL tables) -- exactly what
# dbt-spark's `table` materialization emits. Storage lives under the vended
# bucket, so managed writes also use UC-vended, path-scoped credentials.
server.managed-table.enabled=true
storage-root.tables=s3://lakehouse/managed
storage-root.models=s3://lakehouse/models

# --- Storage credential vending (S3 / MinIO) ---
# bucketPath/region identify the storage; endpoint + pathStyleAccess make the
# S3-compatible (MinIO) backend addressable. accessKey/secretKey/sessionToken
# are populated at runtime by uc-rotate with a bucket-scoped MinIO STS session;
# because sessionToken is set, UC vends these (already-downscoped) creds as-is.
aws.masterRoleArn=
aws.accessKey=
aws.secretKey=
aws.region=us-east-1
s3.bucketPath.0=s3://lakehouse
s3.region.0=us-east-1
s3.awsRoleArn.0=
s3.accessKey.0=
s3.secretKey.0=
s3.sessionToken.0=
s3.endpoint.0=http://minio:9000
s3.pathStyleAccess.0=true

# --- ADLS / GCS (populate when targeting Azure/GCP; vending works natively) ---
adls.storageAccountName.0=
adls.tenantId.0=
adls.clientId.0=
adls.clientSecret.0=
gcs.bucketPath.0=
gcs.jsonKeyFilePath.0=
