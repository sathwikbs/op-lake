#
# Unity Catalog metadata store.
#
# We use H2 in FILE mode, persisted on the uc_data named volume
# (/home/unitycatalog/etc/data), so catalog metadata survives restarts WITHOUT
# the ephemeral in-memory default.
#
# WHY NOT POSTGRES (yet): UC 0.5.x has two open bugs that break MANAGED Delta
# tables on Postgres:
#   * #1364 - the uc_delta_commits DDL uses BINARY(16) for UUID cols, which
#     Postgres rejects, so hbm2ddl silently skips that table.
#   * #1385 - DeltaCommitRepository issues `DELETE ... LIMIT`, invalid in
#     Postgres (fix PR #1446 merged AFTER the 0.5.1 release).
# H2 handles both (BINARY(16) and DELETE ... LIMIT), so managed Delta tables
# work end-to-end. When UC ships a release containing #1446 + the BINARY fix,
# switch to the Postgres block below for a production-grade backend.
#
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:file:/home/unitycatalog/etc/data/ucdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
hibernate.connection.user=sa
hibernate.connection.password=
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.connection.pool_size=10

# --- Production (cloud) backend: PostgreSQL ---
# Enable once UC releases the managed-table Postgres fixes (#1364, #1446).
